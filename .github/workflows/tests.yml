name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[plots]"
      - run: python -m unittest discover -s tests -v
      - run: python -m mcflow init configs/quickstart.json runs/ci
      - run: python -m mcflow run runs/ci --workers 2
      - run: python -m mcflow aggregate runs/ci
      - run: python -m mcflow plot runs/ci
      - run: python -m mcflow slurm runs/ci --concurrency 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-${{ matrix.os }}-py${{ matrix.python }}
          path: runs/ci/analysis/
          if-no-files-found: ignore
