[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-monte-carlo-workflow"
version = "0.1.0"
description = "A reproducible Monte Carlo example with local execution, Slurm arrays, checkpoints, and validated analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kemal Aziz"}]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
mcflow = "mcflow.cli:main"

[project.urls]
Repository = "https://github.com/ka784-jpg/HPC-Monte-Carlo-Workflow"
Issues = "https://github.com/ka784-jpg/HPC-Monte-Carlo-Workflow/issues"

[tool.setuptools.packages.find]
where = ["src"]
